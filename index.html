<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Spirit Rover Route</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 16px; background: #0d0600; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;
    }
    .game-wrapper {
      width: 100%; max-width: 440px; background: #1a0d00; padding: 16px;
      border-radius: 14px; border: 2px solid #ff751a; text-align: center;
    }
    .hud { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 12px; }
    .screen {
      position: relative; width: 100%; height: 360px;
      background: linear-gradient(180deg, #3d1400 0%, #802b00 100%);
      border-radius: 10px; overflow: hidden; border: 2px solid #cc5200;
    }
    .overlay {
      position: absolute; inset: 0; background: rgba(15, 7, 0, 0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 10;
    }
    .hidden { display: none !important; }
    h2 { color: #ff944d; margin: 0 0 10px; font-size: 20px; }
    p { font-size: 13px; line-height: 1.5; color: #f2d9cc; margin: 0 0 20px; }
    .btn {
      background: linear-gradient(135deg, #ff944d, #e65c00); color: #fff;
      border: none; padding: 12px 26px; font-size: 15px; font-weight: bold; border-radius: 24px; cursor: pointer;
    }
    .rover {
      position: absolute; bottom: 20px; left: 50%; width: 40px; height: 40px;
      transform: translateX(-50%); font-size: 32px; line-height: 40px;
    }
    .entity { position: absolute; transform: translateX(-50%); font-size: 24px; }
    .controls { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .touch-btn {
      flex: 1; background: rgba(255, 117, 26, 0.15); border: 2px solid #ff751a;
      color: #ff944d; padding: 16px 0; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer;
    }
    .touch-btn:active { background: rgba(255, 117, 26, 0.4); }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="hud">
      <span id="hud-level">LEVEL: 1/3</span>
      <span id="hud-score" style="color: #ffb366;">SCORE: 0/500</span>
      <span id="hud-energy" style="color: #66ff66;">ENERGY: 100%</span>
    </div>

    <div class="screen" id="arena">
      <div id="rover" class="rover">🤖</div>

      <!-- Start Menu -->
      <div id="screen-start" class="overlay">
        <h2>SPIRIT ROVER ROUTE</h2>
        <p>NASA Educational Mission: Collect 5 Silica Orbs (+100 pts) to advance. Dodge sand traps and rocks!</p>
        <button class="btn" id="start-click-btn">START MISSION</button>
      </div>

      <!-- Info Screen -->
      <div id="screen-fact" class="overlay hidden">
        <h2 id="fact-title" style="color: #66ccff;">MISSION BRIEFING</h2>
        <p id="fact-text"></p>
        <button class="btn" id="fact-click-btn">CONTINUE MISSION</button>
      </div>

      <!-- End Screen -->
      <div id="screen-end" class="overlay hidden">
        <h2 id="end-title">MISSION OVER</h2>
        <p id="end-text"></p>
        <button class="btn" id="end-click-btn">PLAY AGAIN</button>
      </div>
    </div>

    <div class="controls">
      <button class="touch-btn" id="btn-left">⬅️ LEFT</button>
      <button class="touch-btn" id="btn-right">RIGHT ➡️</button>
    </div>
  </div>

  <script>
    const facts = [
      { title: "LEVEL 1: Broken Wheel Effect", text: "In 2006, Spirit's front-right wheel broke. Driving backwards while dragging that wheel accidentally uncovered hidden layers of Mars' soil!" },
      { title: "LEVEL 2: Trapped in Troy", text: "In 2009, Spirit got stuck in a soft sand trap named 'Troy'. NASA turned the rover into a stationary science lab to keep studying Mars." },
      { title: "MISSION COMPLETE: Pure Silica!", text: "Spirit's broken wheel exposed 90% pure silica. This proved ancient Mars had hot springs or steam vents capable of supporting life!" }
    ];

    let state = 'start';
    let level = 1;
    let score = 0;
    let energy = 100;
    let roverX = 50;
    let entities = [];
    let lastTime = 0;
    let spawnTimer = 0;

    const arena = document.getElementById('arena');
    const roverEl = document.getElementById('rover');

    function moveRover(amount) {
      if (state !== 'playing') return;
      roverX = Math.max(10, Math.min(90, roverX + amount));
      roverEl.style.left = roverX + '%';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveRover(-10);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRover(10);
    });

    document.getElementById('btn-left').addEventListener('click', () => moveRover(-10));
    document.getElementById('btn-right').addEventListener('click', () => moveRover(10));

    document.getElementById('start-click-btn').addEventListener('click', setupNewGame);
    document.getElementById('fact-click-btn').addEventListener('click', setupNextLevel);
    document.getElementById('end-click-btn').addEventListener('click', setupNewGame);

    function setupNewGame() {
      level = 1; score = 0; energy = 100; roverX = 50;
      roverEl.style.left = '50%';
      clearAllEntities();
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-fact').classList.add('hidden');
      document.getElementById('screen-end').classList.add('hidden');
      state = 'playing';
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function setupNextLevel() {
      level++; roverX = 50;
      roverEl.style.left = '50%';
      clearAllEntities();
      document.getElementById('screen-fact').classList.add('hidden');
      state = 'playing';
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function clearAllEntities() {
      entities.forEach(item => item.el.remove());
      entities = [];
    }

    function spawnItem() {
      const chance = Math.random();
      let type = 'orb'; let icon = '💎';
      if (chance  (1.5 - level * 0.2)) {
        spawnItem();
        spawnTimer = 0;
      }

      const fallSpeed = 120 + level * 40;

      for (let i = entities.length - 1; i >= 0; i--) {
        const entity = entities[i];
        entity.y += fallSpeed * dt;
        entity.el.style.top = entity.y + 'px';

        if (entity.y > 290 && entity.y  360) {
          entity.el.remove();
          entities.splice(i, 1);
        }
      }

      document.getElementById('hud-level').textContent = `LEVEL: ${level}/3`;
      document.getElementById('hud-score').textContent = `SCORE: ${score}/${level * 500}`;
      const energyHud = document.getElementById('hud-energy');
      energyHud.textContent = `ENERGY: ${Math.max(0, Math.ceil(energy))}%`;
      energyHud.style.color = energy > 30 ? '#66ff66' : '#ff4d4d';

      if (energy <= 0) {
        state = 'gameover';
        document.getElementById('end-title').textContent = 'MISSION FAILED';
        document.getElementById('end-title').style.color = '#ff4d4d';
        document.getElementById('end-text').textContent = 'Your rover got permanently stuck in the sand dunes.';
        document.getElementById('screen-end').classList.remove('hidden');
        return;
      }

      if (score >= level * 500) {
        if (level === 3) {
          state = 'victory';
          document.getElementById('end-title').textContent = 'MISSION SUCCESS! 🎉';
          document.getElementById('end-title').style.color = '#66ff66';
          document.getElementById('end-text').textContent = facts[2].text;
          document.getElementById('screen-end').classList.remove('hidden');
        } else {
          state = 'fact';
          document.getElementById('fact-title').textContent = facts[level - 1].title;
          document.getElementById('fact-text').textContent = facts[level - 1].text;
          document.getElementById('screen-fact').classList.remove('hidden');
        }
        return;
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
